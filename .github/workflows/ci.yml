name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (the tag in the comment); Dependabot
# proposes updates (.github/dependabot.yml).
jobs:
  static-checks:
    name: Static checks (permissions, secrets, resources, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check.py
      - name: Python tools compile
        run: python -m py_compile scripts/*.py tools/*.py art/*.py

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"   # read-only token: report in the job log only

  # The Connect IQ compiler and simulator need device definitions that Garmin
  # only distributes through the SDK manager after sign-in, so the Monkey C
  # build and the unit tests run locally: see scripts/test.sh. CI verifies
  # everything that does not need the SDK.
